<!doctype html>
<html>
  <head>
    <title>Ready About!</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&family=Yellowtail&display=swap"
      rel="stylesheet"
    />

    <!-- Firebase for persistence -->
    <script type="module" src="./firebase-app.js"></script>

    <!-- GSAP for animations -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

    <!-- Confetti animation -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>

    <style>
      html {
        font-size: 14px;
      }
      body {
        font-family: "Inter", sans-serif;
        color: #222;
        background: url(./assets/bg-lake-1.png) no-repeat center center fixed;
        background-size: cover;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }
      [disabled],
      .disabled {
        opacity: 0.5;
        cursor: default;
      }
      em {
        font-family: Yellowtail, cursive;
        font-style: normal;
        font-size: 1.4em;
        display: inline-block;
        /* transform: translateX(-0.1em); */
      }
      button {
        cursor: pointer;
      }
      .normal-button {
        border: none;
        background-color: #5b6676;
        color: #fff;
        font-size: 16px;
        font-weight: bold;
        padding: 8px 16px;
        text-transform: uppercase;
        text-align: center;
      }
      @media (min-width: 1361px) {
        #game-console {
          margin-left: calc((100vw - 1340px) / 2);
          margin-top: 105px;
        }
      }
      @media (max-width: 1360px) {
        #game-console {
          width: 100vw;
          display: flex;
          flex-direction: column;
          align-items: center;
        }
      }
      .tooltip {
        display: none;
        position: absolute;
        z-index: 0;
        width: 170px;
        background: #2d5da4dd;
        border-radius: 20px;
        text-align: left;
        color: #fff;
        font-weight: bold;
        text-shadow: 0 0 1px rgba(0, 0, 0, 0.2);
        padding: 4px 10px;
        transform-origin: 0 0;
        opacity: 0.9;

        p {
          font-size: 12px;
          margin: 8px 0;
        }
      }
      [id^="compass-rose-control-"] {
        width: 86px;
        height: 86px;
        /* transform-origin: 0 0; */

        button {
          position: relative;
          z-index: 1;
          width: 86px;
          height: 86px;
          background-color: transparent;
          background-size: contain;
          background-repeat: no-repeat;
          background-image: url(./assets/compass-rose-petal-n-gray.svg);
          border: none !important;
          transition: all 0.2s ease-in-out;

          &:focus {
            outline: none;
          }

          &:hover {
            transform: scale(1.1);
          }
        }

        span {
          display: inline-block;
          font-family: Inter, sans-serif;
          color: #fff;
          text-shadow: 0 0 1px rgba(0, 0, 0, 0.2);
          font-size: 30px;
          font-weight: bold;
        }

        &[data-tack="starboard"] button {
          background-image: url(./assets/compass-rose-petal-n-green.svg);
        }
        &[data-tack="port"] button {
          background-image: url(./assets/compass-rose-petal-n-rust.svg);
        }
      }
      #compass-rose-controls {
        position: relative;
        z-index: 1;
      }
      #game-board {
        background-image: url(./assets/logo-and-corners.png);
      }
      #game-board[data-wind-direction="NW"] {
        background-image: url(./assets/logo-and-corners-nw-wind.png);
      }
      #game-board[data-wind-direction="NE"] {
        background-image: url(./assets/logo-and-corners-ne-wind.png);
      }
      #game-board[data-wind-direction="SE"] {
        background-image: url(./assets/logo-and-corners-se-wind.png);
      }
      #game-board[data-wind-direction="SW"] {
        background-image: url(./assets/logo-and-corners-sw-wind.png);
      }
      .playing-card {
        box-sizing: border-box;
        width: 200px;
        height: 300px;
        padding: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        background-image: url(./assets/card-bg-generic.png);
        border-radius: 8px;
        box-shadow: 0 0 4px rgba(0, 0, 0, 0.2);
        border-width: 4px;
        border-style: solid;
        background-color: #fafafa;

        h3 {
          font-size: 36px;
          line-height: 1;
          text-align: center;
          margin: 0;
          padding: 0;
        }

        p {
          font-size: 16px;
          font-weight: bold;
        }
      }
      .weather-card {
        border-color: #2d5da4;
        h3 {
          color: #2d5da4;
        }
      }
      .bonus-card {
        border-color: #9f195e;
        h3 {
          color: #9f195e;
        }
      }
      .cursive {
        font-family: "Yellowtail", cursive;
      }
    </style>
  </head>
  <body style="margin: 0">
    <div id="new-game-btn-container" style="position: absolute; z-index: 3; top: 20px; left: 20px">
      <button class="normal-button" style="display: flex; align-items: center" onclick="window.location.href = '/'">
        <span
          style="
            font-size: 30px;
            font-weight: 400;
            line-height: 1;
            margin-right: 8px;
            transform: translate(3px, -1px) rotate(90deg);
          "
        >
          ↻
        </span>
        <span>New Game</span>
      </button>
    </div>

    <div id="game" style="position: relative; float: left">
      <div id="game-console" style="float: left">
        <div
          id="main-controls"
          style="
            position: relative;
            width: 500px;
            height: 500px;
            background: url(./assets/compass-rose.png) no-repeat 100px 100px;
            background-size: 300px 300px;
          "
        >
          <div id="compass-rose-controls" style="position: relative; width: 100%; height: 100%">
            <div
              id="compass-rose-control-n"
              style="position: absolute; top: 0; left: 50%; transform: translate(-50%, 30%)"
            >
              <div class="tooltip" style="transform: translate(30px, -50px)"></div>
              <button><span></span></button>
            </div>
            <div
              id="compass-rose-control-ne"
              style="position: absolute; top: 0; right: 0; transform: rotate(45deg) translate(0, 130%)"
            >
              <div class="tooltip" style="transform: rotate(-45deg) translate(20px, 20px)"></div>
              <button><span style="transform: rotate(-45deg)"></span></button>
            </div>
            <div
              id="compass-rose-control-e"
              style="position: absolute; top: 50%; right: 0; transform: rotate(90deg) translate(-50%, 30%)"
            >
              <div class="tooltip" style="transform: rotate(-90deg) translate(-15px, -10px)"></div>
              <button><span style="transform: rotate(-90deg)"></span></button>
            </div>
            <div
              id="compass-rose-control-se"
              style="position: absolute; bottom: 0; right: 0; transform: rotate(135deg) translate(0, 130%)"
            >
              <div class="tooltip" style="transform: rotate(-135deg) translate(-40px, -50px)"></div>
              <button><span style="transform: rotate(-135deg)"></span></button>
            </div>
            <div
              id="compass-rose-control-s"
              style="position: absolute; bottom: 0; left: 50%; transform: rotate(180deg) translate(50%, 30%)"
            >
              <div class="tooltip" style="transform: rotate(-180deg) translate(-30px, -40px)"></div>
              <button><span style="transform: rotate(-180deg)"></span></button>
            </div>
            <div
              id="compass-rose-control-sw"
              style="position: absolute; bottom: 0; left: 0; transform: rotate(225deg) translate(0, 130%)"
            >
              <div class="tooltip" style="transform: rotate(-225deg) translate(-110px, -45px)"></div>
              <button><span style="transform: rotate(-225deg)"></span></button>
            </div>
            <div
              id="compass-rose-control-w"
              style="position: absolute; top: 50%; left: 0; transform: rotate(270deg) translate(50%, 30%)"
            >
              <div class="tooltip" style="transform: rotate(-270deg) translate(-100px, -15px)"></div>
              <button><span style="transform: rotate(-270deg)"></span></button>
            </div>
            <div
              id="compass-rose-control-nw"
              style="position: absolute; top: 0; left: 0; transform: rotate(315deg) translate(0, 130%)"
            >
              <div class="tooltip" style="transform: rotate(-315deg) translate(-120px, -80px)"></div>
              <button><span style="transform: rotate(-315deg)"></span></button>
            </div>
          </div>
          <div
            id="compass-rose-inner"
            style="
              position: absolute;
              z-index: 2;
              top: 50%;
              left: 50%;
              transform: translate(-50%, -50%);
              width: 250px;
              height: 157px;
              background: #2c3747;
              display: flex;
              justify-content: center;
              align-items: center;
              border-radius: 30px;
              overflow: hidden;
            "
          ></div>
        </div>
        <div
          id="cards"
          style="
            width: 100%;
            text-align: center;
            display: flex;
            justify-content: center;
            padding-top: 30px;
            padding-bottom: 100px;
          "
        >
          <!-- <div id="bonus-cards">
            <h3>Your <em>sailor's delight</em> cards</h3>
            <div
              id="bonus-cards-container"
              style="display: flex; flex-direction: column; gap: 6px; width: 250px; align-items: center"
            ></div>
          </div> -->
          <div id="active-weather-card">
            <h3>Active<br /><em style="font-size: 2em; line-height: 1">weather card:</em></h3>
            <div id="active-weather-card-container" style="display: flex; width: 250px; justify-content: center"></div>
          </div>
        </div>
      </div>
      <div
        id="game-board"
        data-wind-direction="NW"
        style="float: left; position: relative; box-sizing: content-box; background-size: cover; margin-top: 10px"
      ></div>
    </div>

    <div
      id="dialog-container"
      style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000"
    >
      <div
        id="dialog-overlay"
        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5)"
      ></div>
      <div
        id="dialog-content"
        style="
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          background-color: #fff;
          padding: 20px;
          border-radius: 8px;
          box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        "
      >
        <h2 id="dialog-title"></h2>
        <p id="dialog-message"></p>
        <button id="dialog-close-button">Close</button>
      </div>
    </div>

    <script type="module" src="./ready-about.js?v=20260812"></script>
  </body>
</html>
